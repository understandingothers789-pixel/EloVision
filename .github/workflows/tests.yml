name: Tests
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not model and not browser"
      - run: ruff check elovision tests scripts
      - run: ruff format --check elovision tests scripts
